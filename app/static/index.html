<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ActionClue Review</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>ActionClue <span>REVIEW</span></strong><div id="version">接続中…</div><button id="export">レビューを出力</button></header>
<div class="layout"><aside><h2>レビュー対象</h2><input id="search" placeholder="質問・IDを検索"><select id="source"><option value="">すべてのデータソース</option></select><select id="status"><option value="">すべての状態</option><option value="pending">未レビュー</option><option value="good">Good</option><option value="bad">Bad</option><option value="uncertain">要確認</option></select><p id="progress"></p><div id="items"></div></aside>
<main><p id="error" role="alert"></p><div id="content" hidden><div class="eyebrow" id="identity"></div><h1 id="question"></h1><div id="choices"></div><section class="player"><div class="tabs"><button id="oracle">Oracle（64フレーム）</button><button id="full">クリップ全体</button><span id="media-note"></span></div><video id="video" controls playsinline preload="metadata"></video><p id="media-error" role="status"></p></section><div class="columns"><section><h2>正解と根拠</h2><p id="answer"></p><div id="evidence"></div><p id="warnings" class="warning"></p></section><section><h2>レビュー</h2><div id="checks"></div><select id="issue"><option value="">問題の種類</option><option value="anchor">アンカーが曖昧</option><option value="answer">正解が映像と不一致</option><option value="distractor">複数の選択肢が正しい</option><option value="language_bias">映像なしで推測できる</option><option value="timing">時刻・フレームの不一致</option><option value="media">動画の問題</option><option value="other">その他</option></select><textarea id="comment" maxlength="4000" rows="4" placeholder="問題点・修正案"></textarea><div class="actions"><button data-save="good">Good</button><button data-save="bad">Bad</button><button data-save="uncertain">要確認</button></div><p id="saved" role="status"></p></section></div></div></main></div><script src="/ui.js"></script></body></html>
