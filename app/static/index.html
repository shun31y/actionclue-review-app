<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ActionClue Review</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>ActionClue <span>REVIEW</span></strong><span id="version">接続中…</span><span id="progress"></span><button id="export">出力</button></header>
<main id="content" hidden>
<section class="player"><div class="toolbar"><button id="previous" aria-label="前の動画">← 前へ</button><span id="position"></span><button id="next" aria-label="次の動画">次へ →</button><div class="views"><button id="full">クリップ全体</button><button id="oracle">Oracle 64</button></div></div><div class="video-stage"><video id="video" controls playsinline preload="metadata"></video><p id="media-error" role="status"></p></div><div class="evidence-bar"><button id="jump"><kbd>E</kbd> 根拠へ</button><span id="evidence" aria-live="polite">根拠区間</span></div><p id="media-note"></p></section>
<section class="review"><div class="eyebrow" id="identity"></div><h1 id="question"></h1><div id="choices"></div><div class="answer"><span>正解</span><p id="answer"></p></div><p id="warnings" class="warning"></p><label class="comment-label" for="comment">コメント（任意 · Cで入力 / Escで戻る）</label><textarea id="comment" maxlength="4000" rows="2" placeholder="問題点・修正案"></textarea><div class="actions"><button id="accept"><kbd>A</kbd> Accept → 次へ</button><button id="reject"><kbd>R</kbd> Reject → 次へ</button></div><small class="criteria">Accept: アンカーが一意・正解が映像と一致・他の選択肢が誤り・映像が必要</small></section>
</main><footer><span><kbd>A</kbd> Accept　<kbd>R</kbd> Reject　<kbd>E</kbd> 根拠　<kbd>Space</kbd> 再生 / 停止　<kbd>←</kbd><kbd>→</kbd> 前 / 次</span><span id="saved" role="status"></span><span id="error" role="alert"></span></footer><script src="/ui.js"></script></body></html>
